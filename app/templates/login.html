<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            secondary: '#10b981',
            accent: '#f59e0b',
            danger: '#ef4444',
          }
        }
      }
    }
  </script>
</head>
<body class="flex min-h-screen items-center justify-center bg-gray-50">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
    <div class="flex flex-col items-center mb-6">
      <img src="/static/logo.webp" alt="Logo" class="w-16 h-16 mb-2">
      <h2 class="text-2xl font-bold text-primary">Login to AMS</h2>
    </div>
    <form id="loginForm" class="space-y-5" autocomplete="off">
      <div>
        <label class="block text-gray-700 font-medium mb-1">Email or Phone</label>
        <input type="text" name="email_or_phone" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-primary" required maxlength="255">
      </div>
      <div id="passwordField">
        <label class="block text-gray-700 font-medium mb-1">Password</label>
        <input type="password" name="password" class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-primary" required minlength="8" maxlength="255">
      </div>
      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2">
          <input type="checkbox" name="remember_me" class="rounded">
          <span class="text-sm text-gray-600">Remember me</span>
        </label>
        <a href="#" id="forgotPasswordLink" class="text-primary text-sm hover:underline">Forgot password?</a>
      </div>
      <button type="submit" class="w-full bg-primary text-white font-semibold py-2 rounded hover:bg-primary/90 transition">Login</button>
      <div class="text-center text-sm mt-2">Don't have an account? <a href="/register" class="text-primary underline">Register</a></div>
      <div class="text-center mt-4">
        <button type="button" id="toggleOtpLogin" class="text-accent underline text-sm">Login with OTP</button>
      </div>
    </form>
    <!-- OTP Login Modal -->
    <div id="otpLoginModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">
      <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm">
        <h3 class="text-xl font-bold text-primary mb-2">OTP Login</h3>
        <form id="otpLoginForm" class="space-y-4">
          <input type="text" name="contact" placeholder="Email or Phone" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-primary">
          <button type="submit" class="w-full bg-primary text-white font-semibold py-2 rounded hover:bg-primary/90 transition">Send OTP</button>
        </form>
        <form id="otpVerifyForm" class="space-y-4 mt-4 hidden">
          <input type="text" name="otp_code" maxlength="6" pattern="[0-9]{6}" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-primary text-center text-lg tracking-widest">
          <input type="hidden" name="user_id">
          <input type="hidden" name="verification_type" value="login">
          <button type="submit" class="w-full bg-primary text-white font-semibold py-2 rounded hover:bg-primary/90 transition">Verify OTP</button>
        </form>
        <div class="text-center mt-2">
          <button id="closeOtpLoginModal" class="text-danger underline text-sm">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  <script>
  // Toggle OTP login modal
  const toggleOtpLogin = document.getElementById('toggleOtpLogin');
  const otpLoginModal = document.getElementById('otpLoginModal');
  toggleOtpLogin.onclick = function() {
    otpLoginModal.classList.remove('hidden');
  };
  document.getElementById('closeOtpLoginModal').onclick = function() {
    otpLoginModal.classList.add('hidden');
  };
  // Login form submit
  const loginForm = document.getElementById('loginForm');
  loginForm.onsubmit = function(e) {
    e.preventDefault();
    // validateForm logic
    let valid = true;
    loginForm.querySelectorAll('input[required]').forEach(function(input) {
      if (!input.value) {
        input.classList.add('border-danger');
        valid = false;
      } else {
        input.classList.remove('border-danger');
      }
    });
    if (!valid) return;
    const data = Object.fromEntries(new FormData(loginForm));
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/auth/login', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          const resp = JSON.parse(xhr.responseText);
          localStorage.setItem('access_token', resp.access_token);
          localStorage.setItem('refresh_token', resp.refresh_token);
          localStorage.setItem('user_id', resp.user_profile.id);
          window.location.href = '/profile';
        } else {
          alert('Login failed: ' + xhr.responseText);
        }
      }
    };
    xhr.send(JSON.stringify(data));
  };
  // OTP login flow
  const otpLoginForm = document.getElementById('otpLoginForm');
  const otpVerifyForm = document.getElementById('otpVerifyForm');
  otpLoginForm.onsubmit = function(e) {
    e.preventDefault();
    let valid = true;
    otpLoginForm.querySelectorAll('input[required]').forEach(function(input) {
      if (!input.value) {
        input.classList.add('border-danger');
        valid = false;
      } else {
        input.classList.remove('border-danger');
      }
    });
    if (!valid) return;
    const data = Object.fromEntries(new FormData(otpLoginForm));
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/auth/login-otp', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          otpLoginForm.classList.add('hidden');
          otpVerifyForm.classList.remove('hidden');
        } else {
          alert('Failed to send OTP: ' + xhr.responseText);
        }
      }
    };
    xhr.send(JSON.stringify(data));
  };
  otpVerifyForm.onsubmit = function(e) {
    e.preventDefault();
    let valid = true;
    otpVerifyForm.querySelectorAll('input[required]').forEach(function(input) {
      if (!input.value) {
        input.classList.add('border-danger');
        valid = false;
      } else {
        input.classList.remove('border-danger');
      }
    });
    if (!valid) return;
    const data = Object.fromEntries(new FormData(otpVerifyForm));
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/auth/verify-otp', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          alert('Login successful!');
          window.location.href = '/profile';
        } else {
          alert('OTP verification failed: ' + xhr.responseText);
        }
      }
    };
    xhr.send(JSON.stringify(data));
  };
  // Forgot password
  document.getElementById('forgotPasswordLink').onclick = function(e) {
    e.preventDefault();
    alert('Forgot password flow not implemented in UI.');
  };
  </script>
</body>
</html>
