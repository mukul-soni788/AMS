<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS - Base Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2563eb',
              secondary: '#10b981',
              accent: '#f59e0b',
              danger: '#ef4444',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-primary: #2563eb;
        --color-secondary: #10b981;
        --color-accent: #f59e0b;
        --color-danger: #ef4444;
      }
      .sidebar-collapsed { width: 0 !important; }
      .sidebar-expanded { width: 16rem !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Top Navbar -->
    <header class="flex items-center justify-between bg-white shadow px-4 py-2 sticky top-0 z-30">
        <div class="flex items-center gap-2">
            <button id="sidebarToggle" class="md:hidden mr-2 p-2 rounded hover:bg-gray-100 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <img src="/static/logo.webp" alt="Logo" class="h-8 w-8 mr-2">
            <span class="font-bold text-lg text-primary">AMS</span>
        </div>
        <div class="flex-1 max-w-lg mx-4">
            <input type="text" placeholder="Search..." class="w-full px-3 py-2 rounded border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary"/>
        </div>
        <div class="flex items-center gap-4">
            <button class="relative p-2 rounded hover:bg-gray-100 focus:outline-none">
                <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V4a2 2 0 10-4 0v1.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <span class="absolute -top-1 -right-1 bg-danger text-white text-xs rounded-full px-1">3</span>
            </button>
            <div class="relative">
                <button id="profileDropdownBtn" class="flex items-center gap-2 p-2 rounded hover:bg-gray-100 focus:outline-none">
                    <img src="/static/user.webp" alt="User" class="h-8 w-8 rounded-full">
                    <span class="hidden md:inline font-medium">User</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
                <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded shadow-lg z-40">
                    <a href="#" class="block px-4 py-2 hover:bg-gray-100">Profile</a>
                    <a href="#" class="block px-4 py-2 hover:bg-gray-100">Settings</a>
                    <a href="#" class="block px-4 py-2 hover:bg-gray-100">Logout</a>
                </div>
            </div>
        </div>
    </header>
    <!-- Sidebar & Main Content -->
    <div class="flex flex-1">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-white shadow h-screen md:w-64 w-0 md:block transition-all duration-300 overflow-hidden sidebar-expanded">
            <nav class="flex flex-col py-4">
                <a href="#" class="px-6 py-3 flex items-center gap-2 text-gray-700 hover:bg-primary hover:text-white transition rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M13 5v6h6"/></svg>
                    Dashboard
                </a>
                <a href="#" class="px-6 py-3 flex items-center gap-2 text-gray-700 hover:bg-primary hover:text-white transition rounded">Profile</a>
                <a href="#" class="px-6 py-3 flex items-center gap-2 text-gray-700 hover:bg-primary hover:text-white transition rounded">Appointments</a>
                <a href="#" class="px-6 py-3 flex items-center gap-2 text-gray-700 hover:bg-primary hover:text-white transition rounded">Messages</a>
                <a href="#" class="px-6 py-3 flex items-center gap-2 text-gray-700 hover:bg-primary hover:text-white transition rounded">Settings</a>
            </nav>
        </aside>
        <!-- Main Content -->
        <main class="flex-1 p-6">
            <!-- Breadcrumbs -->
            <nav class="text-sm mb-4" aria-label="Breadcrumb">
                <ol class="list-reset flex text-gray-600">
                    <li><a href="#" class="hover:text-primary">Home</a></li>
                    <li><span class="mx-2">/</span></li>
                    <li class="text-primary">Dashboard</li>
                </ol>
            </nav>
            <!-- Page Content -->
            <div id="page-content">
                {% block body %}{% endblock %}
            </div>
        </main>
    </div>
    <!-- Footer -->
    <footer class="bg-white shadow px-4 py-3 text-center text-gray-500 text-sm">
        &copy; 2025 AMS. All rights reserved. | <a href="#" class="text-primary hover:underline">Privacy Policy</a> | <a href="#" class="text-primary hover:underline">Terms</a>
    </footer>
    <!-- Global JS for modal, validation, AJAX -->
    <script>
      // Sidebar toggle for mobile
      document.getElementById('sidebarToggle').onclick = function() {
        var sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('sidebar-expanded')) {
          sidebar.classList.remove('sidebar-expanded');
          sidebar.classList.add('sidebar-collapsed');
        } else {
          sidebar.classList.remove('sidebar-collapsed');
          sidebar.classList.add('sidebar-expanded');
        }
      };
      // Profile dropdown
      document.getElementById('profileDropdownBtn').onclick = function(e) {
        e.stopPropagation();
        var dropdown = document.getElementById('profileDropdown');
        dropdown.classList.toggle('hidden');
      };
      document.body.onclick = function(e) {
        var dropdown = document.getElementById('profileDropdown');
        if (!dropdown.classList.contains('hidden')) {
          dropdown.classList.add('hidden');
        }
      };
      // Modal handling
      window.showModal = function(id) {
        document.getElementById(id).classList.remove('hidden');
      };
      window.hideModal = function(id) {
        document.getElementById(id).classList.add('hidden');
      };
      // Simple form validation
      window.validateForm = function(formId) {
        var form = document.getElementById(formId);
        var valid = true;
        form.querySelectorAll('input[required], select[required], textarea[required]').forEach(function(input) {
          if (!input.value) {
            input.classList.add('border-danger');
            valid = false;
          } else {
            input.classList.remove('border-danger');
          }
        });
        return valid;
      };
      // AJAX helper
      window.ajax = function(url, method, data, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            callback(xhr.status, xhr.responseText);
          }
        };
        xhr.send(JSON.stringify(data));
      };
    </script>
</body>
</html>
